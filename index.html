<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Beach Office</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3ead9;--ink:#4a3b52;--panel:#fffaf0;--accent:#ffb84d;--ok:#2bb58a;--bad:#e5486f;--line:#e3d6bd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;padding:6px}
h1{font-size:22px;margin:0 0 10px}
h1 small{font-weight:400;opacity:.6;font-size:13px}
.layout{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media(max-width:600px){#log,.log{max-height:150px;overflow:auto}.steps{gap:5px}.steps span{padding:7px 0;font-size:11px}.steps span b{font-size:20px}button{padding:14px 12px;font-size:16px}.hint{font-size:12px;opacity:.8}.parch{font-size:16px}#reqin{font-size:16px}body{padding:6px}h1{font-size:18px}.panel{padding:8px 10px}#stage{border-width:2px;border-radius:14px;max-width:none}}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
aside{display:flex;flex-direction:column;gap:10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps span{text-align:center;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:4px 0;font-size:11px}
.steps span b{display:block;font-size:18px}
.steps .active{background:var(--accent);border-color:#e09a2f}
.steps .done{background:#bdf0dd;border-color:var(--ok)}
.steps .bug{background:#ffd1dc;border-color:var(--bad)}
#stage{position:relative;width:100%;max-width:calc((100vh - 12px)*900/1190);margin-inline:auto;border-radius:18px;overflow:hidden;border:3px solid #b9a98a;background:#bfe9ff}
#stage svg{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
#qbtn{position:absolute;z-index:5;width:30px;height:30px;padding:0;border-radius:50%;font-size:17px;font-weight:800;line-height:1;background:#ffd447;color:#5a3d00;border:2px solid #fff;box-shadow:0 2px 8px rgba(60,40,20,.35);display:none;animation:qpop .25s ease-out}
@keyframes qpop{from{transform:scale(.3)}to{transform:scale(1)}}
#zoomc{position:absolute;left:12px;bottom:12px;z-index:4;display:flex;flex-direction:column;gap:6px}
#zoomc button{width:38px;height:38px;padding:0;border-radius:50%;font-size:18px;line-height:1;background:#fffaf0;border:2px solid #e3d6bd;box-shadow:0 2px 6px rgba(60,40,20,.2)}
@media(min-width:900px) and (orientation:landscape){#stage{max-width:calc((100vh - 12px)*1776/1160)}}
#steps{position:absolute;left:11px;top:106px;z-index:3;display:none;flex-direction:column;gap:7px}
#steps.on{display:flex}
#steps span{position:relative;width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:0;cursor:default;box-shadow:0 2px 6px rgba(60,40,20,.25);outline:0}
#steps span b{display:block;font-size:18px;line-height:1}
#steps span::after{content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#4a3b52;color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
#steps span:hover::after,#steps span:focus::after{opacity:1}
#logbtn{position:absolute;right:12px;top:12px;z-index:4;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;line-height:1;background:#fff7e0;border:3px solid #b9a98a;box-shadow:0 3px 0 #a8956c,0 6px 12px rgba(60,40,20,.25)}
#logbtn.new::after{content:"";position:absolute;right:1px;top:1px;width:11px;height:11px;border-radius:50%;background:#e5486f;border:2px solid #fff}
#logbtn.ping{animation:ring .25s 4}
#logpop{position:absolute;right:10px;top:64px;z-index:6;width:min(92%,380px);max-height:56%;display:none;flex-direction:column;background:#4a3b52;border-radius:14px;box-shadow:0 8px 24px rgba(40,28,14,.4);overflow:hidden}
#logpop.open{display:flex;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(-6px) scale(.97);opacity:0}to{transform:none;opacity:1}}
#logpop .lh{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.15)}
#logx{width:30px;height:30px;padding:0;border-radius:50%;font-size:13px;line-height:1;background:#fff;box-shadow:none}
#logpop #log{border-radius:0;height:auto;min-height:90px;flex:1;overflow:auto}
#phone{align-self:flex-start;display:inline-block;background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12px;margin:2px 0}
#phone.ping{animation:ring .25s 4}
.hint{margin:6px 2px 0;font-size:12px;opacity:.65}
button{background:var(--accent);border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;cursor:pointer;color:#3b2a1a;box-shadow:0 3px 0 #c98a2d;font-family:inherit;width:100%}
button:disabled{opacity:.45;cursor:default}
.scroll{position:relative;padding:0 6px;filter:drop-shadow(0 6px 5px rgba(74,50,20,.28))}
.scroll .rod{height:16px;border-radius:9px;background:linear-gradient(#8a5a2b,#c99557 40%,#6e4520);position:relative;z-index:2;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.scroll .rod::before,.scroll .rod::after{content:"";position:absolute;top:-3px;bottom:-3px;width:11px;border-radius:6px;background:linear-gradient(#5b3a18,#b98543 45%,#4a2e12)}
.scroll .rod::before{left:-6px}.scroll .rod::after{right:-6px}
.parch{position:relative;margin:-2px 8px;padding:14px 18px 12px;color:#4a2f14;font-family:Georgia,"Palatino Linotype",serif;font-size:15px;line-height:1.35;text-align:center;
 background:radial-gradient(ellipse at 20% 15%,rgba(255,255,255,.55),transparent 55%),radial-gradient(ellipse at 85% 90%,rgba(150,95,35,.28),transparent 55%),linear-gradient(90deg,rgba(120,75,25,.35),transparent 7%,transparent 93%,rgba(120,75,25,.35)),#f1deb0;
 border-left:1px solid #c9a566;border-right:1px solid #c9a566;transform-origin:top;box-shadow:inset 0 8px 8px -6px rgba(90,55,15,.4),inset 0 -8px 8px -6px rgba(90,55,15,.4)}
.parch small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a6232;margin-bottom:4px}
.parch b{font-weight:700;font-style:italic}
#reqin{display:block;width:100%;margin-top:10px;min-height:76px;max-height:140px;resize:vertical;line-height:1.35;padding:7px 10px;border:0;border-bottom:2px dashed #a8773a;background:rgba(255,248,225,.55);color:#4a2f14;font:italic 14px Georgia,serif;text-align:center;outline:0;border-radius:4px 4px 0 0}
#reqin::placeholder{color:#a58253}#reqin:focus{background:rgba(255,255,240,.85);border-bottom-style:solid}#reqin:disabled{opacity:.5}
#pen{position:absolute;right:12px;bottom:12px;z-index:4;width:50px;height:50px;padding:0;border-radius:50%;font-size:24px;line-height:1;background:#fff7e0;border:3px solid #b9a98a;box-shadow:0 4px 0 #a8956c,0 8px 14px rgba(60,40,20,.3)}
#pen:not(:disabled):hover{transform:translateY(-2px) rotate(-8deg)}
#decree{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(40,28,14,0);transition:background .35s}
#decree.open{display:flex;background:rgba(40,28,14,.5)}
#decree .scroll{width:min(88%,380px)}
#decree .parch{overflow:hidden;padding-top:16px;padding-bottom:14px}
#decree.open .parch{animation:unrollM .8s cubic-bezier(.2,.8,.2,1) both}
#decree.closing .parch{animation:unrollM .45s cubic-bezier(.6,0,.8,.4) reverse both}
@keyframes unrollM{from{max-height:0;padding-top:0;padding-bottom:0;opacity:.5}to{max-height:300px;opacity:1}}
#decree .row{display:flex;gap:8px;margin-top:12px}#decree .row button{flex:1;padding:10px 8px;font-size:14px}
#reqx{background:#efe3c8;box-shadow:0 3px 0 #bfa877}
#seal{background:radial-gradient(circle at 35% 30%,#ef6b5d,#b3261e 60%,#7d1510);color:#ffe9c4;font-family:Georgia,serif;box-shadow:0 3px 0 #5e0f0b}
.sign{display:none;align-items:center;justify-content:center;gap:10px;margin-top:8px}.sign.on{display:flex}.sign em{font-size:11px;color:#8a6232}
.sign i{font:italic 600 21px "Brush Script MT","Segoe Script","Snell Roundhand","Apple Chancery",cursive;color:#2b3a8a;transform:rotate(-3deg);border-bottom:1px solid #2b3a8a55;padding:0 4px}
.stamp{width:44px;height:44px;border-radius:50%;border:3px double #c0392b;color:#c0392b;font:700 9px/1.1 Georgia,serif;display:grid;place-items:center;text-align:center;transform:rotate(-14deg);opacity:.88;letter-spacing:.04em}
.sign.on .stamp{animation:stampin .45s cubic-bezier(.2,1.6,.4,1) .6s both}
@keyframes stampin{from{transform:rotate(-14deg) scale(2.6);opacity:0}to{transform:rotate(-14deg) scale(1);opacity:.88}}
.parch.unroll{animation:unroll .7s cubic-bezier(.2,.8,.2,1)}
@keyframes unroll{from{transform:scaleY(.15);opacity:.4}to{transform:scaleY(1);opacity:1}}
#go{position:relative;margin-top:12px;background:radial-gradient(circle at 35% 30%,#ef6b5d,#b3261e 60%,#7d1510);color:#ffe9c4;font-family:Georgia,serif;letter-spacing:.06em;box-shadow:0 4px 0 #5e0f0b,0 8px 10px rgba(90,20,15,.35);text-shadow:0 1px 1px rgba(0,0,0,.4);border-radius:30px 26px 32px 28px/28px 32px 26px 30px;transition:transform .12s}
#go:not(:disabled):hover{transform:translateY(-2px) rotate(-1deg)}#go:not(:disabled):active{transform:translateY(2px);box-shadow:0 1px 0 #5e0f0b}

#card{display:none;position:absolute;left:10px;right:10px;bottom:74px;z-index:7;max-height:58%;overflow:auto;background:#fff;border-radius:14px;padding:12px;border:3px solid var(--bad);box-shadow:0 8px 24px rgba(40,28,14,.4)}
#card.gate{border-color:var(--accent)}
#card h3{margin:0 0 4px;font-size:17px}#card p{margin:0 0 8px;font-size:14px}
#card .opts{display:flex;flex-direction:column;gap:6px}
#card button{text-align:left;background:#f3ead9;box-shadow:none;border:2px solid var(--line);font-size:14px}
#card button.wrong{background:#ffd1dc;text-decoration:line-through}
#profile{position:absolute;left:8px;right:8px;bottom:8px;z-index:5;max-height:48%;overflow:auto;box-shadow:0 6px 22px rgba(60,40,20,.35);background:#fffaf0}
#pf-x{position:absolute;right:8px;top:8px;width:30px;height:30px;padding:0;border-radius:50%;font-size:14px;line-height:1;background:#fff;border:2px solid var(--line);color:#4a3b52;cursor:pointer;box-shadow:none}
#profile .top{padding-right:34px;display:flex;gap:10px;align-items:center}
#profile svg{width:84px;height:92px;background:#e9f3f0;border-radius:12px;flex:none}
#profile h3{margin:0;font-size:18px}
#profile .role{font-weight:700;color:#7a5c9a;font-size:14px}
#profile .meta{font-size:13px;opacity:.8}
#profile p{margin:8px 0 4px;font-size:13px}
#profile ul{margin:0 0 6px;padding-left:18px;font-size:13px}
#profile .status{font-size:12px;background:#f3ead9;border-radius:8px;padding:4px 8px}
#clock,#wx,#lang,#snd{position:absolute;left:12px;width:38px;height:38px;display:grid;place-items:center;background:#fffaf0;border:2px solid #e3d6bd;border-radius:50%;font-size:19px;line-height:1;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(60,40,20,.2)}
#clock{top:12px}
#clock.pv::after,#wx.pv::after{content:"";position:absolute;right:-1px;top:-1px;width:10px;height:10px;border-radius:50%;background:#ffb84d;border:2px solid #fff}
#log{background:#4a3b52;color:#fff;border-radius:12px;padding:8px;height:150px;overflow:auto;font:12px/1.5 ui-monospace,monospace}
#log p{margin:0}.ok{color:#7ff0c3}.bad{color:#ff9ab3}.warn{color:#ffd98a}

/* SVG animation */
svg .catin{transform-box:fill-box;transform-origin:50% 100%}
svg .c .catin{animation:breathe 2.6s ease-in-out infinite}
svg .c.active .catin{animation:type .3s ease-in-out infinite}
svg .c.bug .catin{animation:shake .25s linear infinite}
svg .c.cheer .catin{animation:hop .5s ease-in-out infinite}
svg .c.stretch .catin{animation:stretch .9s ease-in-out}
svg .alert,svg .okb{display:none}
svg .c.bug .alert,svg .c.done .okb{display:block}
svg .ring{opacity:0}svg .c.sel .ring{opacity:1}
svg .lp.back .lid polygon:first-child{fill:#b8bcc6}
svg .lp.front .lid polygon:first-child{fill:#33d1b0}
svg .lp.back.active .lid polygon:first-child{fill:#ffd166}
svg .lp.active .lid{animation:glow .4s alternate infinite}
svg .lp.bug .lid polygon:first-child{fill:#ff6b88}
svg #cwalk.walk{animation:walk .22s ease-in-out infinite}
svg #cwalk.eat{animation:type .7s ease-in-out infinite}
svg #cwalk.play{animation:hop .6s ease-in-out infinite}
svg .c.walking .catin{animation:walk .22s ease-in-out infinite}
svg .c.a-eat .catin{animation:type .7s ease-in-out infinite}
svg .c.a-play .catin{animation:hop .6s ease-in-out infinite}
svg .armL,svg .armR,svg .legL,svg .legR{transform-box:fill-box;transform-origin:50% 8%}
svg .legL,svg .legR{transform-origin:50% 0}
svg .shut,svg .claws{opacity:0}
svg .a-type .armL,svg #cwalk.type .armL{animation:tapL .2s ease-in-out infinite}
svg .a-type .armR,svg #cwalk.type .armR{animation:tapL .2s ease-in-out infinite .1s}
svg .a-type .catin{animation:typeB .6s ease-in-out infinite}
svg .a-scratch .armR,svg #cwalk.scratch .armR{animation:claw .26s ease-in-out infinite alternate}
svg .a-scratch .armL,svg #cwalk.scratch .armL{animation:claw2 .26s ease-in-out infinite alternate .13s}
svg .a-scratch .claws,svg #cwalk.scratch .claws{animation:clawf .26s steps(2) infinite alternate}
svg .a-scratch .catin,svg #cwalk.scratch .catin{animation:lean .52s ease-in-out infinite}
svg .a-lie .eyes,svg .a-nap .eyes,svg #cwalk.nap .eyes{opacity:0}
svg .a-lie .shut,svg .a-nap .shut,svg #cwalk.nap .shut{opacity:1}
svg .a-lie .catin,svg .a-nap .catin,svg #cwalk.nap .catin{animation:snore 3.2s ease-in-out infinite;transform:none}
svg .a-lie .tail,svg .a-nap .tail{animation-duration:4.5s}
svg .a-lie .armL,svg .a-lie .armR{transform:rotate(14deg)}
svg .a-swim .armL{animation:paddleL .9s ease-in-out infinite}
svg .a-swim .armR{animation:paddleR .9s ease-in-out infinite .45s}
svg .a-swim .legL{animation:kick .45s ease-in-out infinite alternate}
svg .a-swim .legR{animation:kick .45s ease-in-out infinite alternate-reverse}
svg .a-swim .catin{animation:swimb 1.8s ease-in-out infinite}
svg .a-float .armL{animation:drift 3s ease-in-out infinite alternate}
svg .a-float .armR{animation:drift 3s ease-in-out infinite alternate-reverse}
svg .a-float .legL,svg .a-float .legR{animation:kick 2.4s ease-in-out infinite alternate}
svg .a-wave .armR{animation:wave .32s ease-in-out infinite alternate;transform:rotate(-140deg)}
@keyframes tapL{50%{transform:translateY(-4px) rotate(-12deg)}}
@keyframes typeB{50%{transform:translateY(-1px) rotate(.8deg)}}
@keyframes claw{from{transform:rotate(-150deg)}to{transform:rotate(-100deg) translateY(2px)}}
@keyframes claw2{from{transform:rotate(60deg)}to{transform:rotate(15deg)}}
@keyframes clawf{from{opacity:.95}to{opacity:.15}}
@keyframes lean{50%{transform:rotate(4deg) translateX(2px)}}
@keyframes snore{50%{transform:scale(1.04,.96)}}
@keyframes paddleL{0%,100%{transform:rotate(30deg)}50%{transform:rotate(-70deg)}}
@keyframes paddleR{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(70deg)}}
@keyframes kick{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes swimb{50%{transform:translateY(-2px) rotate(-1.5deg)}}
@keyframes drift{from{transform:rotate(12deg)}to{transform:rotate(36deg)}}
@keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-105deg)}}
svg .yawn,svg .tongue{opacity:0;transform-box:fill-box;transform-origin:50% 0}
svg .a-yawn .yawn{animation:yawn 2.2s ease-in-out}
svg .a-yawn .catin{animation:yawnb 2.2s ease-in-out}
svg .a-yawn .eyes{animation:yawne 2.2s ease-in-out}
svg .a-yawn .armR{animation:yawna 2.2s ease-in-out}
svg .a-groom .catin{animation:groomb 1.1s ease-in-out infinite}
svg .a-groom .armR{transform:rotate(-155deg) translate(-4px,2px);animation:lick .5s ease-in-out infinite alternate}
svg .a-groom .tongue{animation:lickt .5s ease-in-out infinite alternate}
svg .a-dance .catin{animation:dance .6s ease-in-out infinite}
svg .a-dance .armL{animation:dL .6s ease-in-out infinite}
svg .a-dance .armR{animation:dR .6s ease-in-out infinite}
svg .a-dance .legL{animation:kick .3s ease-in-out infinite alternate}
svg .a-dance .legR{animation:kick .3s ease-in-out infinite alternate-reverse}
svg .a-dance .tail{animation-duration:.4s}
svg .c.cheer .armL{animation:dL .5s ease-in-out infinite}
svg .c.cheer .armR{animation:dR .5s ease-in-out infinite}
svg .a-eat .armL,svg .a-eat .armR,svg #cwalk.eat .armL,svg #cwalk.eat .armR{animation:munch .7s ease-in-out infinite}
@keyframes yawn{0%,100%{opacity:0;transform:scaleY(.1)}30%,70%{opacity:1;transform:scaleY(1.5)}}
@keyframes yawnb{30%,70%{transform:scale(1.05,1.07)}}
@keyframes yawne{25%,75%{transform:scaleY(.15)}}
@keyframes yawna{25%,75%{transform:rotate(-140deg) translate(-3px,3px)}}
@keyframes groomb{50%{transform:rotate(-3deg)}}
@keyframes lick{from{transform:rotate(-155deg) translate(-4px,2px)}to{transform:rotate(-165deg) translate(-4px,0)}}
@keyframes lickt{from{opacity:0}to{opacity:1}}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}
@keyframes dL{0%,100%{transform:rotate(150deg)}50%{transform:rotate(95deg)}}
@keyframes dR{0%,100%{transform:rotate(-95deg)}50%{transform:rotate(-150deg)}}
@keyframes munch{0%,100%{transform:rotate(0)}50%{transform:rotate(-125deg) translate(-2px,2px)}}
svg #tags{pointer-events:none}
svg .tag{filter:drop-shadow(0 1px 2px rgba(40,50,90,.22))}
svg .tag rect{backdrop-filter:blur(4px)}
svg .boss.talk .catin{animation:type .35s ease-in-out infinite}
svg .swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 2s ease-in-out infinite alternate}
svg .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.8s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
svg .eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite;animation-delay:var(--d,0s)}
svg #zzz{display:none;animation:float 1.4s ease-in-out infinite}
svg .furn,svg .c,svg .boss,svg #courier{cursor:pointer}
svg .umb{transform-origin:0 0;animation:umb 3.2s ease-in-out infinite alternate}
svg .ball{transform-origin:640px 468px;animation:roll 2.6s ease-in-out infinite alternate}
svg .star{animation:twinkle 3s ease-in-out infinite alternate}
#chat{pointer-events:none}
.snowcap{opacity:0;transition:opacity 5s}svg.snowy .snowcap{opacity:1}
.puddle{opacity:0;transition:opacity 6s}svg.rainy .puddle{opacity:1}
.ripple{transform-box:fill-box;transform-origin:center;animation:ripple 1.6s ease-out infinite}
@keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(1);opacity:0}}
#wx{top:56px}
#snd{top:144px;padding:0}
#lang{top:100px;font:700 12px system-ui,sans-serif;color:#7a5c3a;padding:0}
.rain{animation:rainY linear infinite}
.snow{animation:snowY linear infinite}
@keyframes rainY{from{transform:translate(0,-80px)}to{transform:translate(-90px,1000px)}}
@keyframes snowY{0%{transform:translate(0,-40px)}50%{transform:translate(22px,460px)}100%{transform:translate(-8px,1000px)}}
@keyframes flash{0%{opacity:0}8%{opacity:.85}18%{opacity:.1}30%{opacity:.7}100%{opacity:0}}
#flash.go{animation:flash .7s ease-out}
svg.stormy .sway{animation-duration:.9s!important}svg.stormy .frond{animation-duration:.45s!important}
svg.stormy .umb{animation-duration:.7s!important}svg.stormy .wind{animation-duration:1.6s!important;opacity:.9}
@keyframes umb{from{transform:rotate(-2deg)}to{transform:rotate(3.5deg)}}
@keyframes roll{from{transform:translateX(-12px) rotate(-150deg)}to{transform:translateX(14px) rotate(170deg)}}
@keyframes twinkle{from{opacity:.25}to{opacity:1}}
svg .sway{transform-origin:0 0;animation:sway 3.4s ease-in-out infinite alternate}
svg .frond{transform-origin:4px -80px;animation:frond 1.7s ease-in-out infinite alternate}
svg .wind{animation:windX 5s linear infinite;opacity:0}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(3deg)}}
@keyframes frond{from{transform:rotate(-6deg)}to{transform:rotate(7deg)}}
@keyframes windX{0%{transform:translateX(-120px);opacity:0}15%{opacity:.8}85%{opacity:.8}100%{transform:translateX(900px);opacity:0}}
svg .beam{fill:var(--beamc,#fff3c4);opacity:var(--beam,.18)}
svg .wavel{animation:waveL 7s linear infinite}
@keyframes waveL{to{stroke-dashoffset:-1000}}
svg .wave{animation:waveX 4s linear infinite}
svg .cloud{animation:cloudX 110s linear infinite}
svg .gull{animation:cloudX 38s linear infinite}

function reorder(el){
  const L=el.parentNode,d=el.__d,p=el.previousElementSibling,n=el.nextElementSibling;
  if((!p||p.__d<=d)&&(!n||n.__d>=d))return;
  let ref=null;for(const c of L.children){if(c!==el&&c.__d>d){ref=c;break}}
  L.insertBefore(el,ref);
}
function mover({el,flipEl,pos,off,walkOn,walkOff}){
  const o={el,pos,off,
    apply(){const [px,py]=P(o.pos[0],o.pos[1]);
      el.setAttribute('transform',`translate(${px.toFixed(1)} ${(py+o.off).toFixed(1)})`);
      el.__d=depth(o.pos[0],o.pos[1])+(o.bias||0);reorder(el);o.onMove&&o.onMove()},
    face(dx){if(Math.abs(dx)>1)flipEl.setAttribute('transform',`scale(${dx<0?-1:1} 1)`)},
    walk(on){on?walkOn():walkOff()}};
  return o;
}
const ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
function glide(o,tx,ty,dur){
  return new Promise(res=>{
    const [x0,y0]=o.pos,t0=performance.now();
    (function step(t){
      const k=Math.min(1,(t-t0)/dur),e=ease(k);
      o.pos=[x0+(tx-x0)*e,y0+(ty-y0)*e];o.apply();
      k<1?requestAnimationFrame(step):res();
    })(t0);
  });
}
// Walk around the table, never across it.
const OBST={x0:1.5,x1:8.1,y0:.5,y1:2.95},CORNERS=[[1.3,.4],[8.3,.4],[8.3,3.05],[1.3,3.05]];
const clear=(a,b)=>{for(let t=0;t<=1;t+=.04){const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
  if(x>OBST.x0&&x<OBST.x1&&y>OBST.y0&&y<OBST.y1)return false}return true};
function route(a,b){
  const len=p=>p.slice(1).reduce((s,q,i)=>s+Math.hypot(q[0]-p[i][0],q[1]-p[i][1]),0);
  const ok=p=>p.slice(1).every((q,i)=>clear(p[i],q));
  const cands=[[a,b],...CORNERS.map(c=>[a,c,b]),...CORNERS.flatMap(c=>CORNERS.filter(d=>d!==c).map(d=>[a,c,d,b]))];
  return cands.filter(ok).sort((p,q)=>len(p)-len(q))[0]||[a,b];
}
async function walkTo(o,x,y,msPerUnit=330){
  const path=route([...o.pos],[x,y]);
  for(const [px,py] of path.slice(1)){
    const [x0,y0]=o.pos,dist=Math.hypot(px-x0,py-y0);if(dist<.02)continue;
    o.face(P(px,py)[0]-P(x0,y0)[0]);o.walk(true);
    await glide(o,px,py,Math.max(350,dist*msPerUnit));
  }
  o.walk(false);
}

// Walk to the lift, ride it, walk out on the other floor. Anyone can ride; there is one car, so riders queue.
async function ride(o,f){
  while(riding)await sleep(150);
  if(o.fl===f)return;
  riding=true;const from=o.fl,up=f>from;
  try{
    await walkTo(o,...ELEV.door);
    o.face(-10);await doors(from,true);
    toLayer(o,$('carRider'),$('tags'+(from+1)));
    o.walk(true);o.face(P(...ELEV.in)[0]-P(...o.pos)[0]);
    await glide(o,...ELEV.in,550);o.walk(false);
    await doors(from,false);
    setInd(up?'▲':'▼');
    toLayer(o,$('carRider'),$('tagsTop'),-from*FT);
    const rideZ=(a,b)=>tween(2200*(b-a),k=>{const z=(from+(f-from)*(a+(b-a)*k))*FT;carSet(z);o.tagDy=-z;o.onMove()});
    const jam=o.onJam&&f<from?.3+Math.random()*.4:null;  // a rider may get stuck on the way down
    if(jam==null)await rideZ(0,1);
    else{await rideZ(0,jam);setInd('⚠');const z=(from+(f-from)*jam)*FT;
      await o.onJam(P(...ELEV.in)[0],P(...ELEV.in)[1]-z);setInd('▼');await rideZ(jam,1)}
    setInd(String(f+1));o.fl=f;
    await doors(f,true);
    toLayer(o,$('carRider'),$('tags'+(f+1)),0);o.tagDy=0;
    o.walk(true);o.face(P(...ELEV.door)[0]-P(...o.pos)[0]);
    await glide(o,...ELEV.door,550);o.walk(false);
    toLayer(o,$('actors'+(f+1)),$('tags'+(f+1)),0);
    await doors(f,false);
  }finally{riding=false}
}

// Long speech wraps onto several lines instead of stretching sideways; the bubble grows upward.
function wrapText(text,max){
  const out=[];let cur='';
  for(const w of String(text).split(/\s+/)){
    if(cur&&(cur+' '+w).length>max){out.push(cur);cur=w}else cur=cur?cur+' '+w:w}
  if(cur)out.push(cur);return out.length?out:[''];
}

  const fl=od||key==='sage'?0:key==='boss'?boss.fl:key==='claude'?courier.fl:cats[key].mv.fl,[px,py0]=at||(od?[od.xy[0],od.xy[1]-100]:P(o.pos[0],o.pos[1],100)),py=at?py0:py0-fl*FT;

// Only the cat whose step is running sits at a computer; the rest stand beside their desks.
const outOf=c=>spotOf(c.i);
async function leaveDesk(c){
  if(!c.sitting)return;c.busy=true;stand(c);const o=outOf(c);
  c.mv.walk(true);await glide(c.mv,o[0],o[1],450);c.mv.walk(false);c.mv.face(5);c.busy=false;
}
async function takeDesk(c){
  if(c.sitting)return;c.busy=true;await walkTo(c.mv,...outOf(c),400);
  c.mv.walk(true);await glide(c.mv,c.seat.x,c.seat.y,450);c.mv.walk(false);sit(c);c.busy=false;
}
// The finished cat passes the ticket to the next one, then gets up from the computer.
async function handoff(i){
  const c=cats[STEPS[i].id],nx=cats[STEPS[i+1]?.id];
  c.emo.textContent='🎫';
  if(nx){
    if(nx.fl===c.fl){c.mv.face(P(...nx.mv.pos)[0]-P(...c.mv.pos)[0]);speak(STEPS[i].id,T("Tag, you're it, {0}! 🎫",nx.who.name),2200)}
    else speak(STEPS[i].id,'Claude, take this upstairs! 🎫',2200);
  }
  await sleep(1100);c.emo.textContent='';await leaveDesk(c);
}
async function runQuest(q){
  running=true;UIEV('begin',q);$('go').disabled=$('pen').disabled=true;$('reqin').disabled=true;hideSay();$('steps').classList.add('on');
  recall=true;if(wanderTask)await wanderTask;
  Object.values(cats).forEach(c=>c.recall=true);await Promise.all(Object.values(cats).map(c=>c.task));
  STEPS.forEach(s=>['active','bug','done','cheer'].forEach(c=>mark(s.id,c,false)));
  await Promise.all(Object.values(cats).map(leaveDesk));
  boardReset(q);sayBoss(T('New quest: {0}',q));await sleep(2000);hideSay();
  for(let i=0;i<STEPS.length;i++){
    const st=STEPS[i];curStep=st.id;
    if(!(await UIcp()))return abortQuest();
    if(flOf(i)!==courier.fl){await goto(flOf(i-1),spotOf(i-1)[0]+.6,spotOf(i-1)[1]);await goto(flOf(i),spotOf(i)[0]+.6,spotOf(i)[1])}
    await takeDesk(cats[st.id]);
    sayCat(st.say,st.id);mark(st.id,'active',true);board(st.id,'active');log(st.log);refreshStatus();UIEV('start',i);
    await sleep(1500);
    if(!(await UIcp()))return abortQuest();
    if(st.incident&&Math.random()<st.incident.p)await incident(st);
    if(st.gate&&!(await gate(st))){
      log('Quest cancelled (correct: never push or deploy unasked).','warn');UIEV('deny',i);
      mark(st.id,'active',false);board(st.id,'todo');curStep=null;refreshStatus();await finish();return}
    mark(st.id,'active',false);mark(st.id,'done',true);board(st.id,'done');SND.play('ding');UIEV('done',i);
    if(['git','ops','qa'].includes(st.id)){
      $('phone').classList.add('ping');$('logbtn').classList.add('ping');await sleep(1000);$('phone').classList.remove('ping');$('logbtn').classList.remove('ping');
      log(T('📱 Phone: {0} finished',T(st.name)),'ok')}
    await handoff(i);
  }
  curStep=null;refreshStatus();hideSay();
  SND.play('fanfare');log('Quest complete!','ok');UIEV('complete',q);sayBoss('Great work, team!');
  STEPS.forEach(s=>mark(s.id,'cheer',true));await sleep(2200);STEPS.forEach(s=>mark(s.id,'cheer',false));hideSay();
  await Promise.all(Object.values(cats).map(takeDesk));await catBreak();await finish();
}

/* ---------- Sound: everything is synthesised with Web Audio, so there are no audio files and nothing to license ---------- */
const SND=(()=>{
  let ctx,master,musicG,sfxG,on=true,started=false,step=0,nextT=0,timer=0;
  try{on=localStorage.getItem('snd')!=='off'}catch(e){}
  const init=()=>{if(ctx)return true;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
    ctx=new AC();master=ctx.createGain();master.gain.value=on?1:0;master.connect(ctx.destination);
    musicG=ctx.createGain();musicG.gain.value=vol.m;musicG.connect(master);sfxG=ctx.createGain();sfxG.gain.value=vol.s;sfxG.connect(master);return true};
  const tone=(f,t,d,type='sine',v=.3,dest=sfxG,to=null)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05)};
  const pluck=(f,t,d,v)=>{const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='triangle';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=2400;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(lp);lp.connect(g);g.connect(musicG);o.start(t);o.stop(t+d+.05)};
  const shaker=t=>{const n=ctx.createBufferSource(),b=ctx.createBuffer(1,2205,44100),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    n.buffer=b;const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;const g=ctx.createGain();g.gain.value=.12;n.connect(hp);hp.connect(g);g.connect(musicG);n.start(t)};
  // original little ukulele loop: C - Am - F - G, major pentatonic tune on top
  const CH=[[261.63,329.63,392,523.25],[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392]];
  const PEN=[523.25,587.33,659.25,783.99,880,1046.5],ARP=[0,1,2,1,3,1,2,1],EIGHTH=.27;
  const sched=()=>{if(!ctx||!on)return;while(nextT<ctx.currentTime+.5){
    const bar=Math.floor(step/8)%4,k=step%8,ch=CH[bar],t=nextT;
    pluck(ch[ARP[k]],t,.5,.2);
    if(k===0||k===4)pluck(ch[0],t,.45,.32);
    if(k%2===1)shaker(t);
    if((k===2||k===6)&&Math.random()<.65)pluck(PEN[Math.floor(Math.random()*PEN.length)],t,.7,.16);
    step++;nextT+=EIGHTH}};
  const startMusic=()=>{if(started||!ctx)return;started=true;nextT=ctx.currentTime+.1;timer=setInterval(sched,120)};
  const SFX={
    click:t=>tone(520,t,.09,'sine',.3,sfxG,880),
    pop:t=>{tone(660,t,.07,'sine',.3,sfxG,990);tone(990,t+.06,.08,'sine',.2)},
    boing:t=>tone(220,t,.28,'sine',.35,sfxG,520),
    meow:t=>{const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();o.type='sawtooth';lp.type='lowpass';lp.Q.value=6;
      o.frequency.setValueAtTime(520,t);o.frequency.linearRampToValueAtTime(880,t+.12);o.frequency.linearRampToValueAtTime(430,t+.42);
      lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(1800,t+.14);lp.frequency.linearRampToValueAtTime(600,t+.42);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.04);g.gain.linearRampToValueAtTime(.16,t+.25);g.gain.exponentialRampToValueAtTime(.001,t+.45);
      o.connect(lp);lp.connect(g);g.connect(sfxG);o.start(t);o.stop(t+.5)},
    ding:t=>{tone(784,t,.18,'triangle',.3);tone(1175,t+.1,.3,'triangle',.28)},
    bonk:t=>tone(180,t,.22,'square',.2,sfxG,90),
    fanfare:t=>[523.25,659.25,784,1046.5].forEach((f,i)=>tone(f,t+i*.11,.25,'triangle',.28))
  };
  const play=n=>{if(!on||!init())return;if(ctx.state==='suspended')ctx.resume();SFX[n](ctx.currentTime+.01)};
  const vol={m:.32,s:.5};try{vol.m=+(localStorage.getItem('vm2')??.32);vol.s=+(localStorage.getItem('vs')??.5)}catch(e){}
  const setVol=(k,v)=>{vol[k]=v;try{localStorage.setItem(k==='m'?'vm2':'vs',v)}catch(e){}if(k==='m'&&musicG)musicG.gain.value=v;if(k==='s'&&sfxG)sfxG.gain.value=v};
  const label=()=>{const b=$('snd');b.textContent=on?'🔊':'🔇';b.title=T('Sound on/off')};
  const set=v=>{on=v;try{localStorage.setItem('snd',v?'on':'off')}catch(e){}
    if(v&&init()){master.gain.value=1;if(ctx.state==='suspended')ctx.resume();startMusic()}else if(master)master.gain.value=0;label()};
  // Phones need the audio unlocked inside a real touch/click, and iOS also mutes Web Audio on the silent switch unless a media element is playing.
  let el,unlocked=false;
  const gesture=()=>{if(!on||!init())return;
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    if(!el){try{el=document.createElement('audio');el.loop=true;el.setAttribute('playsinline','');
      const n=800,b=new Uint8Array(44+n),v=new DataView(b.buffer);const w=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
      w(0,'RIFF');v.setUint32(4,36+n,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);w(36,'data');v.setUint32(40,n,true);b.fill(128,44);
      el.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}catch(e){el=null}}
    if(el&&el.paused)el.play().catch(()=>{});
    const go=()=>{unlocked=ctx.state==='running';startMusic()};
    if(ctx.state!=='running'){const r=ctx.resume();r&&r.then?r.then(go,go):go()}else go();
    try{const s=ctx.createBufferSource();s.buffer=ctx.createBuffer(1,1,22050);s.connect(ctx.destination);s.start(0)}catch(e){}};
  ['touchstart','touchend','click','keydown'].forEach(n=>document.addEventListener(n,()=>{if(!unlocked||(ctx&&ctx.state!=='running'))gesture()},true));
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;document.hidden?ctx.suspend():(on&&ctx.resume())});
  return {play,set,gesture,label,setVol,vol,get on(){return on}};
})();

   [/quy trinh|workflow|hcph|cac buoc|tam buoc|\bflow\b|\bsteps?\b|lam sao de/,()=>L("Quy trình HCPH có 8 bước:\n","The HCPH flow has 8 steps:\n")+STEPS.map((st,i)=>`${i+1}. ${st.icon} ${T(st.name)} — ${st.who.name}`).join('\n')+L("\nMỗi bước một mèo ngồi vào bàn, xong thì chuyền vé cho bạn kế tiếp.","\nEach step has one cat at the desk, then the ticket is passed on.")],

  const msgs=$('sagemsgs'),add=(t,who)=>{const d=document.createElement('div');d.className='sm '+who;d.textContent=t;msgs.append(d);msgs.scrollTop=msgs.scrollHeight;return d};
  const ask=t=>{t=t.trim();if(!t)return;UIEV('sage');add(t,'me');const dots=add('…','bot');
    setTimeout(()=>{dots.textContent=sageAnswer(t);msgs.scrollTop=msgs.scrollHeight;SND.play('pop')},350+Math.random()*350)};
  const chips=L(["Quy trình HCPH?","Ai làm bước nào?","Luật push/deploy?","Cách chơi?","Kể chuyện cười"],["The HCPH flow?","Who does what?","Push/deploy rules?","How to play?","Tell a joke"]);
  $('sagechips').innerHTML=chips.map((c,i)=>`<button type="button" data-q="${['quy trinh','ai lam buoc nao','luat push deploy','cach choi','ke chuyen cuoi'][i]}">${c}</button>`).join('');
  $('sagechips').onclick=e=>{const b=e.target.closest('button');if(b)ask(b.dataset.q)};
  $('sageform').onsubmit=e=>{e.preventDefault();const i=$('sagein');ask(i.value);i.value=''};
  const open=()=>{SAGE.open=true;$('sagebox').classList.add('on');if(!msgs.childElementCount)add(L("Hmm? À… chào bạn. Tôi là Mr Biết Tuốt, cụ mèo già đang nằm nghỉ. Hỏi tôi về quy trình, các bé mèo hay cách chơi nhé. Chạm vào gợi ý bên dưới cũng được.","Hmm? Oh… hello. I'm Mr Know-It-All, an old cat having a lie-down. Ask me about the workflow, the cats or how to play. You can also tap a suggestion below."),'bot');
    speak('sage',L("Hmm? Ờ… hỏi đi, từ từ thôi.","Hmm? Oh… ask away, slowly."),2200)};
  const close=()=>{SAGE.open=false;$('sagebox').classList.remove('on')};
  el.addEventListener('click',e=>{e.stopPropagation();SAGE.open?close():open()});
  $('sagex').onclick=close;
  $('sagein').addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

/* ---------- Time of day (from the device clock) ---------- */
const PHASES={
  morning:{n:'🌅 Morning',sk:['#a6dcf5','#ffe6c4'],se:['#c4f4dd','#45c0cc'],sun:[150,10],sc:'#ffe39a',sg:'#ffe9b0',cl:'#fff',tint:['#ffd9b0',.12]},
  noon:{n:'☀️ Noon',sk:['#8fd6f4','#fff1d8'],se:['#b4f1e4','#31bccf'],sun:[760,-30],sc:'#fff4a0',sg:'#fff6b8',cl:'#fff',tint:['#fff',0]},
  sunset:{n:'🌇 Sunset',sk:['#5d5fb8','#ffb067'],se:['#ff9f7c','#5a6bb0'],sun:[860,60],sc:'#fff0a8',sg:'#ff9a5a',cl:'#ffc9a8',tint:['#ffa878',.3]},
  night:{n:'🌙 Night',sk:['#0a1840','#2f4488'],se:['#26427c','#0a1a3e'],sun:[850,-35],sc:'#f4f1d6',sg:'#cfd8ff',cl:'#7c8ab8',tint:['#5868b4',.42]}
};
const phaseOf=h=>h>=5&&h<9?'morning':h>=9&&h<16?'noon':h>=16&&h<19?'sunset':'night';
let phaseOverride=null;
function applyTime(){
  const key=phaseOverride||phaseOf(new Date().getHours()),p=PHASES[key],night=key==='night';
  $('sk0').setAttribute('stop-color',p.sk[0]);$('sk1').setAttribute('stop-color',p.sk[1]);
  $('se0').setAttribute('stop-color',p.se[0]);$('se1').setAttribute('stop-color',p.se[1]);
  $('sg0').setAttribute('stop-color',p.sg);$('sg1').setAttribute('stop-color',p.sg);
  $('sunG').setAttribute('transform',`translate(${p.sun[0]} ${p.sun[1]})`);
  $('sunD').style.display=night?'none':'';$('moonD').style.display=night?'':'none';
  $('sunD').setAttribute('fill',p.sc);$('stars').style.display=night?'':'none';
  document.querySelectorAll('.cloud > g').forEach(g=>g.setAttribute('fill',p.cl));
  document.querySelectorAll('.gull').forEach(g=>g.style.display=night?'none':'');
  const w=WX[weather],bad=weather!=='sunny';
  $('sunG').style.display=bad?'none':'';$('stars').style.display=night&&!bad?'':'none';
  if(bad)document.querySelectorAll('.cloud > g').forEach(g=>g.setAttribute('fill',night?'#3a4260':w.cl));
  $('wxdim').setAttribute('fill',w.dim[0]);$('wxdim').setAttribute('opacity',w.dim[1]);
  const t=$('tint');t.setAttribute('fill',p.tint[0]);t.setAttribute('opacity',Math.min(.6,p.tint[1]+(bad?.08:0)));
  scene.style.setProperty('--beam',weather==='sunny'?{morning:.18,noon:.22,sunset:.26,night:0}[key]:.04);scene.style.setProperty('--beamc',key==='sunset'?'#ffb27a':'#fff3c4');
  $('clock').textContent=p.n.split(' ')[0];$('clock').title=T('Time: {0}',T(p.n.replace(/^\S+\s*/,'')))+' '+(phaseOverride?T('(preview)'):T('(device clock)'))+' — '+T('click to change');$('clock').classList.toggle('pv',!!phaseOverride);
}
$('clock').onclick=e=>{e.stopPropagation();const ks=['auto',...Object.keys(PHASES)];
  const i=ks.indexOf(phaseOverride||'auto');const n=ks[(i+1)%ks.length];phaseOverride=n==='auto'?null:n;applyTime()};
applyTime();setInterval(applyTime,60000);
